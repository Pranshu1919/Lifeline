services:
  - type: web
    name: lifeline-disaster-response
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - key: ML_HOST
        value: 127.0.0.1
      - key: ML_PORT
        value: 5000
